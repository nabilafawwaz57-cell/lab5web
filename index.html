<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 5 JavaScript</title>
</head>
<body>
    <h1>Praktikum 5 JavaScript Dasar</h1>
    <p id="pesan">Konten awal.</p>
    
    <h2>Cek Bilangan Genap atau Ganjil</h2>

    <label for="bilangan">Masukkan bilangan bulat:</label>
    <input type="number" id="bilangan" step="1">

    <button type="button" onclick="cekBilangan()">Periksa</button>

    <p id="hasilBilangan"></p>

    <h2>Ubah Warna Latar</h2>

    <button type="button" onclick="ubahWarnaLatar('lightgreen')">
        Latar Hijau
    </button>

    <button type="button" onclick="ubahWarnaLatar('white')">
        Latar Putih
    </button>

    <button type="button" onclick="ubahWarnaLatar('lightyellow')">
        Latar Kuning
    </button>

    <h2>Daftar Menu Makanan</h2>

    <label>
        <input type="checkbox" class="menu" value="5000">
        Ayam Goreng — Rp5.000
    </label>
    <br>

    <label>
        <input type="checkbox" class="menu" value="500">
        Tempe — Rp500
    </label>
    <br>

    <label>
        <input type="checkbox" class="menu" value="2500">
        Telur Dadar — Rp2.500
    </label>
    <br>

    <label>
        <input type="checkbox" class="menu" value="4000">
        Roti Bakar — Rp4.000
    </label>
    <br>

    <label>
        <input type="checkbox" class="menu" value="6000">
        Kentang Goreng — Rp6.000
    </label>
    <br>

    <p>Total: Rp<span id="total">0</span></p>
    
    <hr>
    <h2>Kalkulator Nilai Mahasiswa</h2>

    <form id="formNilai">
        <label for="tugas">Nilai Tugas (0–100):</label>
        <input type="number" id="tugas" min="0" max="100" required>
        <br><br>

        <label for="uts">Nilai UTS (0–100):</label>
        <input type="number" id="uts" min="0" max="100" required>
        <br><br>

        <label for="uas">Nilai UAS (0–100):</label>
        <input type="number" id="uas" min="0" max="100" required>
        <br><br>

        <button type="submit">Hitung Nilai</button>
    </form>

    <div id="hasilNilai"></div>

    <hr>
    <h2>Validasi Form</h2>

    <form id="formValidasi">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" placeholder="Masukkan nama">

        <br><br>

        <label for="nilai">Nilai (0–100):</label>
        <input type="number" id="nilai" placeholder="Masukkan nilai">

        <br><br>

        <button type="submit">Periksa Data</button>
    </form>

    <p id="hasilValidasi"></p>
    
    <hr>
    <h2>Eksperimen Sembunyikan dan Tampilkan</h2>

    <p id="teksEksperimen">
        Ini adalah teks yang bisa disembunyikan dan ditampilkan.
    </p>

    <button type="button" onclick="sembunyikanTeks()">
        Sembunyikan Teks
    </button>

    <button type="button" onclick="tampilkanTeks()">
        Tampilkan Teks
    </button>

    <script src="script.js"></script>
</body>
</html>
